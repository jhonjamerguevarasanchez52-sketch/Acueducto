# Despliegue en Render (Blueprint). Define los dos servicios del proyecto:
#   - hidro-app:   API REST (backend/), la que usan la app móvil y el panel.
#   - hidro-admin: panel administrativo (sitio estático).
# Los secretos se configuran en el panel de Render (sync: false = no se
# guardan en el repositorio). Ver backend/.env.example.
services:
  - type: web
    name: hidro-app
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WOMPI_AMBIENTE
        sync: false
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_INTEGRITY_KEY
        sync: false
      - key: WOMPI_EVENTS_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: web
    name: hidro-admin
    runtime: static
    rootDir: hidro-admin
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://hidro-app.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
