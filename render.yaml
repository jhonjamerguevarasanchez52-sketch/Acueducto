services:
  - type: web
    name: hidro-admin
    runtime: static
    rootDir: hidro-admin
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://hidro-app.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
